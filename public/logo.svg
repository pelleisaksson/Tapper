        <line x1="88.1" y1="72" x2="84.6" y2="70"/><line x1="72" y1="88.1" x2="70" y2="84.6"/>
        <line x1="28" y1="88.1" x2="30" y2="84.6"/><line x1="11.9" y1="72" x2="15.4" y2="70"/>
        <line x1="11.9" y1="28" x2="15.4" y2="30"/><line x1="28" y1="11.9" x2="30" y2="15.4"/>
