<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath></defs>
  <circle cx="50" cy="50" r="48" fill="#1c1c1c"/>
  <g clip-path="url(#c)">
    <!-- clock face: hour ticks -->
    <g stroke="#fff" stroke-linecap="round">
      <g stroke-width="3.2">
        <line x1="50" y1="6" x2="50" y2="13"/><line x1="94" y1="50" x2="87" y2="50"/>
