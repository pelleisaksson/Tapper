         C68 70 66 69 63 71
         C57 74 50 77 42 78
         C30 79 16 83 -4 91 Z"/>
    <path d="M25 27 C27 23 33 23 34 28" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="50" cy="44" rx="2" ry="1.6" fill="#1c1c1c"/>
  </g>
</svg>
